<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yanne Vicente - Portfolio</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body { font-family: 'Poppins', sans-serif; }
    .nav-link { 
      transition: color 0.3s ease; 
      color: rgb(131, 147, 195);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-link:hover { color: #fec643 !important; }
    .nav-link.active { color: #fec643 !important; }
    .page-hidden { display: none !important; }

    .portfolio-item { 
      position: relative; 
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1/1;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .portfolio-item:hover img { transform: scale(1.5); }
    .portfolio-item .overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
        display: flex; flex-direction: column; justify-content: flex-end;
        padding: 1rem; opacity: 0; transition: opacity 0.3s;
    }
    .portfolio-item:hover .overlay { opacity: 1; }
    
    .carousel-container { position: relative; overflow: hidden; }
    .carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; }
    .carousel-slide.active { opacity: 1; }
    .carousel-dots { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 0.5rem; }
    .carousel-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: background 0.3s; }
    .carousel-dot.active { background: #fec643; }

    .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        flex: 1;
    }
    @media (max-width: 768px) {
        .split-layout { grid-template-columns: 1fr; }
    }
    .image-col { position: sticky; top: 0; height: calc(100 * min(var(--vh, 1vh), 1vh)); overflow: hidden; }
    .image-col img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 768px) {
        .image-col { position: relative; height: 50vh; }
    }
    
    .social-buttons { display: flex; gap: 20px; margin-top: 50px; }
    .icon-link {
        font-size: 35px; color: #ffbd59; text-decoration: none;
        transition: transform 0.3s ease, color 0.3s ease;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-link:hover { transform: translateY(-5px); }
    .instagram:hover { color: #E1306C; }
    .linkedin:hover { color: #0077B5; }
    .bluesky:hover { color: #0085ff; }
    .x-twitter:hover { color: #000000; }

    .portfolio-grid {
      gap: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    @media (max-width: 1024px) {
      .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .portfolio-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="w-full min-h-screen flex flex-col" style="background: rgb(250, 249, 247);">
  
  <!-- NAVEGAÇÃO -->
  <nav class="sticky top-0 z-40 backdrop-blur-md border-b border-gray-200/50" style="background: rgba(250, 249, 247, 0.9);">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <span class="text-2xl font-bold cursor-pointer" style="color: #fec643;" onclick="switchPage('home')">YV</span>
      <div class="flex gap-8">
        <a onclick="switchPage('home')" class="nav-link" id="nav-home">HOME</a>
        <a onclick="switchPage('contact')" class="nav-link" id="nav-contact">CONTACT</a>
      </div>
    </div>
  </nav>

  <!-- HOME -->
  <main id="home-section" class="w-full flex-1">
    <div class="carousel-container relative w-full overflow-hidden" style="height: calc(45 * min(var(--vh, 1vh), 1vh));">
      <div class="carousel-slide active">
        <img class="w-full h-full object-cover" loading="lazy" src="assets/images/banner1.jpg" alt="Banner 1">
      </div>
      <div class="carousel-slide">
        <img class="w-full h-full object-cover" loading="lazy" src="assets/images/banner2.jpg" alt="Banner 2">
      </div>
      <div class="carousel-slide">
        <img class="w-full h-full object-cover" loading="lazy" src="assets/images/banner3.jpg" alt="Banner 3">
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>
    </div>
    
    <section class="max-w-6xl mx-auto px-6 py-8">
      <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>
  </main>

  <!-- CONTACT -->
  <main id="contact-section" class="split-layout page-hidden flex-1">
    <div class="image-col">
      <img id="profile-photo" class="w-full h-full object-cover" loading="lazy" src="" alt="Yanne Vicente">
    </div>
    <div class="flex flex-col justify-between p-8 md:p-12 lg:p-16 overflow-y-auto">
      <div>
        <h1 id="profile-name" class="leading-none tracking-tight" style="color: rgb(255, 189, 89); font-weight: 900; font-size: 57px; line-height: 0.9;"></h1>
        <p id="profile-subtitle" class="mt-2 tracking-widest uppercase" style="color: rgb(131, 147, 195); font-weight: 600; font-size: 23px;"></p>
        <div id="profile-bio" class="mt-8 space-y-4"></div>
        
        <div class="social-buttons" id="social-buttons"></div>
        
        <div class="mt-8">
          <h3 style="color: rgb(131, 147, 195); font-weight: 800; font-size: 32px;">YOU CAN ALSO EMAIL ME</h3>
          <a id="email-link" class="inline-block mt-6 px-12 py-4 rounded-full font-semibold text-2xl hover:scale-105 transition-transform" href="mailto:" style="background: rgb(255, 189, 89); color: rgb(74, 74, 74); font-size: 22px;"></a>
        </div>
      </div>
      
      <section class="mt-16 pt-10 border-t border-gray-200">
        <h2 style="color: rgb(131, 147, 195); font-weight: 800; font-size: 32px;">OR SEND ME<br>A KIND MESSAGE!</h2>
        <div data-fs-success class="mt-6 p-4 bg-green-50 text-green-700 rounded-lg hidden font-medium text-sm">Message successfully sent! ✨</div>
        <div data-fs-error class="mt-6 p-4 bg-red-50 text-red-600 rounded-lg hidden font-medium text-sm">Something went wrong... Try it once more! :)</div>

        <form id="contact-form" class="mt-6 space-y-4" action="https://formspree.io/f/mgogvbke" method="POST">
          <div>
            <label class="text-xs block mb-1 uppercase tracking-wider" style="color: rgb(131, 147, 195); font-weight: 600;">E-mail*</label> 
            <input type="email" name="email" required class="w-full border-b-2 border-gray-300 bg-transparent px-0 py-2 focus:outline-none focus:border-[#8393c3] transition-colors" placeholder="your@email.com">
          </div>
          <div>
            <label class="text-xs block mb-1 uppercase tracking-wider" style="color: rgb(131, 147, 195); font-weight: 600;">Message*</label> 
            <textarea name="message" required rows="3" class="w-full border-b-2 border-gray-300 bg-transparent px-0 py-2 focus:outline-none focus:border-[#8393c3] transition-colors resize-none" placeholder="Your message here..."></textarea>
          </div>
          <button type="submit" class="px-10 py-3 rounded-full font-bold text-sm tracking-widest hover:scale-105 transition-transform" style="background: rgb(255, 189, 89); color: rgb(74, 74, 74);">SEND</button>
        </form>
      </section>
    </div>
  </main>

  <!-- MODAL -->
  <div id="projectModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeProjectModal()"></div>
    <div class="group relative bg-white rounded-2xl shadow-2xl max-w-5xl w-full overflow-hidden flex flex-col md:flex-row z-10 max-h-[90vh]">
      <button onclick="closeProjectModal()" class="absolute top-4 right-4 z-20 bg-white/80 hover:bg-white text-gray-800 rounded-full p-1.5 shadow-md transition-all duration-300 opacity-0 group-hover:opacity-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="relative w-full md:w-3/5 bg-gray-100 flex items-center justify-center overflow-hidden aspect-video md:aspect-auto md:min-h-[450px]">
        <img id="modalImage" class="w-full h-full object-cover" src="" alt="Projeto">
        <button onclick="prevModalImage()" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 rounded-full p-1.5 shadow-md transition-all duration-300 z-10 opacity-0 group-hover:opacity-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button onclick="nextModalImage()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-gray-800 rounded-full p-1.5 shadow-md transition-all duration-300 z-10 opacity-0 group-hover:opacity-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <div class="carousel-dots" id="modal-carousel-dots"></div>
      </div>
      <div class="w-full md:w-2/5 p-6 md:p-8 flex flex-col bg-white overflow-y-auto">
        <h2 id="modalTitle" class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-1 leading-tight"></h2>
        <p id="modalClient" class="text-sm md:text-base text-gray-500 font-medium mb-6"></p>
        <hr class="border-gray-100 mb-6">
        <p id="modalDescription" class="text-sm md:text-base text-gray-600 leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-gray-200 mt-12" style="background: rgb(250, 249, 247);">
    <div class="max-w-6xl mx-auto px-6 py-6 text-center">
      <p id="footer-text" class="text-sm" style="color: rgb(131, 147, 195); font-weight: 700; font-size: 16px;"></p>
    </div>
  </footer>

  <script>
    // CARREGA OS DADOS
    let siteData = {};
    let currentProjectIndex = 0;

    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        siteData = data;
        renderPortfolio(data.portfolio);
        renderProfile(data.profile);
        renderSocial(data.social);
        renderFooter(data.site);
        setupCarousel();
        setupNavigation();
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Erro ao carregar dados. Verifique o arquivo data.json');
      });

    function renderPortfolio(projects) {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '';
      projects.forEach((project, index) => {
        grid.innerHTML += `
          <div class="portfolio-item" onclick="openProjectModal(${index})">
            <img loading="lazy" src="${project.image}" alt="${project.title}">
            <div class="overlay">
              <p class="font-bold text-sm" style="color: white;">${project.title}</p>
              <p class="text-xs opacity-80" style="color: rgba(255,255,255,0.8);">${project.category} · ${project.year}</p>
            </div>
          </div>
        `;
      });
    }

    function renderProfile(profile) {
      document.getElementById('profile-name').textContent = profile.name;
      document.getElementById('profile-subtitle').textContent = profile.subtitle;
      document.getElementById('profile-photo').src = profile.photo;
      const bioContainer = document.getElementById('profile-bio');
      bioContainer.innerHTML = '';
      profile.bio.forEach(text => {
        bioContainer.innerHTML += `<p class="leading-relaxed" style="color: rgb(74, 74, 74); font-size: 14px;">${text}</p>`;
      });
      document.getElementById('email-link').href = `mailto:${profile.email}`;
      document.getElementById('email-link').textContent = profile.email;
    }

    function renderSocial(social) {
      const container = document.getElementById('social-buttons');
      container.innerHTML = '';
      const icons = {
        instagram: 'fa-brands fa-instagram',
        linkedin: 'fa-brands fa-linkedin',
        bluesky: 'fa-brands fa-bluesky',
        twitter: 'fa-brands fa-x-twitter'
      };
      Object.keys(social).forEach(key => {
        if (social[key]) {
          container.innerHTML += `<a href="${social[key]}" target="_blank" rel="noopener" class="icon-link ${key}"><i class="${icons[key]}"></i></a>`;
        }
      });
    }

    function renderFooter(site) {
      document.getElementById('footer-text').textContent = site.footer;
    }

    function openProjectModal(index) {
      currentProjectIndex = index;
      const project = siteData.portfolio[index];
      document.getElementById('modalImage').src = project.image;
      document.getElementById('modalTitle').textContent = project.title;
      document.getElementById('modalClient').textContent = `${project.category} · ${project.year}`;
      document.getElementById('modalDescription').textContent = project.description;
      updateModalDots();
      const modal = document.getElementById('projectModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeProjectModal() {
      const modal = document.getElementById('projectModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100', 'pointer-events-auto');
    }

    function prevModalImage() {
      const total = siteData.portfolio.length;
      currentProjectIndex = (currentProjectIndex - 1 + total) % total;
      updateModalContent(currentProjectIndex);
    }

    function nextModalImage() {
      const total = siteData.portfolio.length;
      currentProjectIndex = (currentProjectIndex + 1) % total;
      updateModalContent(currentProjectIndex);
    }

    function updateModalContent(index) {
      const project = siteData.portfolio[index];
      document.getElementById('modalImage').src = project.image;
      document.getElementById('modalTitle').textContent = project.title;
      document.getElementById('modalClient').textContent = `${project.category} · ${project.year}`;
      document.getElementById('modalDescription').textContent = project.description;
      updateModalDots();
    }

    function updateModalDots() {
      const container = document.getElementById('modal-carousel-dots');
      container.innerHTML = '';
      siteData.portfolio.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = 'carousel-dot' + (index === currentProjectIndex ? ' active' : '');
        dot.onclick = () => { currentProjectIndex = index; updateModalContent(index); };
        container.appendChild(dot);
      });
    }

    function switchPage(page) {
      const homeSection = document.getElementById('home-section');
      const contactSection = document.getElementById('contact-section');
      const navHome = document.getElementById('nav-home');
      const navContact = document.getElementById('nav-contact');
      navHome.classList.remove('active');
      navContact.classList.remove('active');
      if (page === 'contact') {
        homeSection.classList.add('page-hidden');
        contactSection.classList.remove('page-hidden');
        navContact.classList.add('active');
        history.pushState(null, '', '#contact');
      } else {
        homeSection.classList.remove('page-hidden');
        contactSection.classList.add('page-hidden');
        navHome.classList.add('active');
        history.pushState(null, '', '#home');
      }
      window.scrollTo(0, 0);
    }

    function setupNavigation() {
      window.addEventListener('load', () => {
        if (window.location.hash === '#contact') switchPage('contact');
        else switchPage('home');
      });
      window.addEventListener('popstate', () => {
        if (window.location.hash === '#contact') switchPage('contact');
        else switchPage('home');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeProjectModal();
      });
    }

    function setupCarousel() {
      const slides = document.querySelectorAll('.carousel-slide');
      const dotsContainer = document.getElementById('carousel-dots');
      let currentSlide = 0;
      slides.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
        dot.addEventListener('click', () => goToSlide(index));
        dotsContainer.appendChild(dot);
      });
      function goToSlide(index) {
        slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
        document.querySelectorAll('.carousel-dot').forEach((dot, i) => dot.classList.toggle('active', i === index));
        currentSlide = index;
      }
      setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        goToSlide(currentSlide);
      }, 6000);
    }
  </script>
</body>
</html>
