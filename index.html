<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg" href="assets/images/favicon.svg">
  <title>Yanne Vicente - Illustration</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    body { font-family: 'Poppins', sans-serif; background: rgb(250, 249, 247); }
    
    /* NAVEGAÇÃO */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(250, 249, 247, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200, 200, 200, 0.3);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .navbar-logo img { height: 40px; width: auto; cursor: pointer; }
    .navbar-menu { display: flex; align-items: center; gap: 2rem; }
    .navbar-menu .menu-icon-link {
      color: rgb(131, 147, 195);
      transition: color 0.3s ease, transform 0.3s ease;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
    }
    .navbar-menu .menu-icon-link:hover { color: #fec643; transform: scale(1.1); }
    
    .nav-link { 
      transition: color 0.3s ease; 
      color: rgb(131, 147, 195);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-link:hover { color: #fec643 !important; }
    .nav-link.active { color: #fec643 !important; }
    .page-hidden { display: none !important; }
    
    @media (max-width: 640px) {
      .navbar { padding: 0.75rem 1rem; flex-wrap: wrap; }
      .navbar-menu { gap: 1rem; }
      .navbar-menu .menu-icon-link { font-size: 16px; }
      .nav-link { font-size: 13px; }
    }

    /* PÁGINA DE PROJETO - NOVO DESIGN */
    .project-section {
      background: #ffffff;
      min-height: calc(100vh - 80px);
      padding: 0;
    }
    
    .project-section .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgb(131, 147, 195);
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s ease;
      background: none;
      border: none;
      font-size: 16px;
      padding: 20px 30px 10px 30px;
    }
    .project-section .back-btn:hover { color: #fec643; }
    
    .project-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0;
      min-height: calc(100vh - 130px);
      background: #ffffff;
    }
    
    /* Lado esquerdo - Carrossel (2/3) */
    .project-carousel {
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 500px;
    }
    
    .project-carousel .main-image-container {
      width: 100%;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .project-carousel .main-image-container img {
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      transition: transform 0.3s ease;
      background: #ffffff;
    }
    
    .project-carousel .main-image-container img:hover {
      transform: scale(1.02);
    }
    
    /* Controles do carrossel */
    .carousel-controls {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
      z-index: 10;
    }
    
    .carousel-controls button {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      transition: all 0.3s ease;
      color: #4a4a4a;
    }
    .carousel-controls button:hover {
      background: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .carousel-controls button.hidden { display: none !important; }
    
    /* Miniaturas */
    .carousel-thumbnails {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 16px 20px 10px 20px;
      width: 100%;
      max-width: 90%;
      scrollbar-width: thin;
      justify-content: center;
      flex-wrap: wrap;
    }
    .carousel-thumbnails::-webkit-scrollbar { height: 4px; }
    .carousel-thumbnails::-webkit-scrollbar-thumb { background: #fec643; border-radius: 4px; }
    
    .carousel-thumbnails img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s ease;
      background: #f5f5f5;
      flex-shrink: 0;
    }
    .carousel-thumbnails img:hover {
      border-color: #fec643;
      transform: scale(1.05);
    }
    .carousel-thumbnails img.active-thumb {
      border-color: #fec643;
      box-shadow: 0 0 0 2px #fec643;
    }
    
    /* Lado direito - Info (1/3) */
    .project-info {
      background: #ffffff;
      padding: 40px 35px 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-left: 1px solid #f0f0f5;
      overflow-y: auto;
      max-height: calc(100vh - 130px);
    }
    
    .project-info .title {
      color: #8d9bc7;
      font-weight: 800;
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .project-info .client {
      color: #aab0c4;
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .project-info .divider {
      border: none;
      border-top: 2px solid #f0f0f5;
      margin-bottom: 20px;
    }
    .project-info .description {
      color: #4a4a4a;
      font-size: 14px;
      line-height: 1.8;
      flex: 1;
    }
    .project-info .description p { margin-bottom: 12px; }
    .project-info .description p:last-child { margin-bottom: 0; }
    
    .project-info .footer-icons {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f5;
    }
    .project-info .footer-icons a,
    .project-info .footer-icons button {
      color: #c5c9d6;
      transition: color 0.3s ease;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .project-info .footer-icons a:hover,
    .project-info .footer-icons button:hover {
      color: #fec643;
    }
    
    @media (max-width: 1024px) {
      .project-layout {
        grid-template-columns: 1fr 1fr;
      }
      .project-info .title { font-size: 24px; }
      .project-info { padding: 30px 25px; }
      .carousel-thumbnails img { width: 60px; height: 60px; }
    }
    
    @media (max-width: 768px) {
      .project-layout {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .project-carousel {
        min-height: 300px;
        padding: 15px;
      }
      .project-carousel .main-image-container {
        max-height: 50vh;
      }
      .project-carousel .main-image-container img {
        max-height: 50vh;
      }
      .project-info {
        border-left: none;
        border-top: 1px solid #f0f0f5;
        padding: 25px 20px 30px;
        max-height: none;
        overflow-y: visible;
      }
      .project-info .title { font-size: 22px; }
      .carousel-thumbnails img { width: 50px; height: 50px; }
      .carousel-controls button { width: 36px; height: 36px; }
      .project-section .back-btn { padding: 15px 20px 5px 20px; }
    }
    
    @media (max-width: 480px) {
      .project-carousel .main-image-container { max-height: 40vh; }
      .project-carousel .main-image-container img { max-height: 40vh; }
      .project-info { padding: 20px 15px 25px; }
      .project-info .title { font-size: 18px; }
      .carousel-thumbnails img { width: 44px; height: 44px; }
      .carousel-thumbnails { gap: 6px; padding: 12px 10px 8px 10px; }
    }

    /* MODAL DE ZOOM */
    .zoom-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 40px;
    }
    .zoom-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .zoom-modal img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .zoom-modal .close-zoom {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      transition: all 0.3s ease;
      color: #4a4a4a;
      font-size: 24px;
    }
    .zoom-modal .close-zoom:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    @media (max-width: 640px) {
      .zoom-modal { padding: 20px; }
      .zoom-modal img { max-width: 95vw; max-height: 80vh; }
    }

    /* PÁGINA INICIAL (WORK) */
    .portfolio-wrapper {
      width: 100%;
      max-width: 100%;
      padding: 30px 30px 10px 30px;
      margin: 0;
    }
    .portfolio-grid {
      gap: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
    }
    .portfolio-item { 
      position: relative; 
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1/1;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: box-shadow 0.4s ease;
      background: #e8e6e4;
    }
    .portfolio-item:hover { box-shadow: 0 16px 48px rgba(0,0,0,0.15); }
    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      border-radius: 16px;
    }
    .portfolio-item:hover img { transform: scale(1.05); }
    .portfolio-item .overlay {
      position: absolute; 
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 50%, transparent 70%);
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end;
      padding: 1.5rem;
      opacity: 0; 
      transition: opacity 0.4s ease;
      border-radius: 16px;
    }
    .portfolio-item:hover .overlay { opacity: 1; }
    
    @media (max-width: 1024px) {
      .portfolio-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .portfolio-wrapper { padding: 24px 20px 10px 20px; }
    }
    @media (max-width: 640px) {
      .portfolio-grid { grid-template-columns: 1fr; gap: 16px; }
      .portfolio-wrapper { padding: 16px 16px 10px 16px; }
      .portfolio-item { border-radius: 12px; }
    }

    /* BANNER */
    .banner-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: #e8e6e4;
      min-height: 100px;
    }
    .banner-container img { width: 100%; height: auto; display: block; object-fit: cover; }
    
    .section-header { margin-bottom: 28px; }
    .section-header h2 {
      color: rgb(131, 147, 195);
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    @media (max-width: 640px) { .section-header h2 { font-size: 28px; } }

    /* CONTACT */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      height: 100%;
    }
    .contact-grid .image-col {
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
      background: #e8e6e4;
    }
    .contact-grid .image-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .contact-grid .contact-content {
      height: 100vh;
      overflow-y: auto;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    @media (max-width: 768px) {
      .contact-grid { grid-template-columns: 1fr; min-height: auto; }
      .contact-grid .image-col { height: 50vh; position: relative; }
      .contact-grid .contact-content { height: auto; overflow-y: visible; padding: 2rem 1.5rem; }
    }
    
    .bio-wrapper { max-width: 550px; width: 100%; }
    .bio-wrapper p {
      color: rgb(74, 74, 74);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    
    .social-buttons { display: flex; gap: 20px; margin-top: 40px; }
    .icon-link {
      font-size: 35px; color: #ffbd59; text-decoration: none;
      transition: transform 0.3s ease, color 0.3s ease;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-link:hover { transform: translateY(-5px); }
    .instagram:hover { color: #E1306C; }
    .linkedin:hover { color: #0077B5; }
    .bluesky:hover { color: #0085ff; }
    .x-twitter:hover { color: #000000; }

    /* FORMULÁRIO */
    .form-section {
      background-color: #8393c3;
      border-radius: 20px;
      padding: 30px 32px;
      margin-top: 20px;
      width: 100%;
      max-width: 550px;
    }
    .form-section h2 {
      color: #ffffff;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.3px;
    }
    .form-section .form-label {
      color: rgba(255,255,255,0.85);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-section input,
    .form-section textarea {
      background: rgba(255,255,255,0.2);
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      color: #ffffff;
      padding: 10px 0;
      width: 100%;
      transition: border-color 0.3s ease;
      font-size: 14px;
    }
    .form-section input:focus,
    .form-section textarea:focus {
      outline: none;
      border-bottom-color: #ffffff;
      background: rgba(255,255,255,0.1);
    }
    .form-section input::placeholder,
    .form-section textarea::placeholder {
      color: rgba(255,255,255,0.5);
    }
    .form-section .submit-btn {
      background: #fec643;
      color: #4a4a4a;
      padding: 12px 40px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .form-section .submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .form-section .form-success {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }
    .form-section .form-success.show { display: block; }
    @media (max-width: 640px) {
      .form-section { padding: 20px; border-radius: 16px; }
      .form-section h2 { font-size: 20px; }
    }

    .footer-yellow {
      background-color: #fec643 !important;
      padding: 1.5rem 0 !important;
    }
    .footer-yellow p { color: #4a4a4a !important; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #4a4a4a;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .loader {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(131, 147, 195, 0.2);
      border-top: 4px solid #fec643;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }
  </style>
</head>

<body class="w-full min-h-screen flex flex-col">

  <!-- NAVEGAÇÃO -->
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="assets/images/logo.svg" alt="Yanne Vicente Logo" onclick="navigateTo('work')" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';" width="40" height="40">
      <span id="logo-fallback" class="text-2xl font-bold cursor-pointer" style="color: #fec643; display: none;" onclick="navigateTo('work')">YV</span>
    </div>
    <div class="navbar-menu">
      <a href="https://wa.me/+5581996385618" target="_blank" rel="noopener" class="menu-icon-link" title="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
      <a href="https://instagram.com/yanne.vicente" target="_blank" rel="noopener" class="menu-icon-link" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a onclick="navigateTo('work')" class="nav-link" id="nav-work">WORK</a>
      <a onclick="navigateTo('contact')" class="nav-link" id="nav-contact">CONTACT</a>
    </div>
  </nav>

  <!-- PÁGINA PRINCIPAL (WORK) -->
  <main id="work-section" class="w-full flex-1">
    <div class="banner-container">
      <img src="assets/images/banner1.jpg" alt="Banner" loading="lazy" decoding="async" onerror="this.style.display='none'" width="1200" height="400">
    </div>
    <section class="portfolio-wrapper">
      <div class="section-header">
        <h2>Professional doodler for tiny humans :) ✨</h2>
      </div>
      <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>
  </main>

  <!-- PÁGINA DE PROJETO -->
  <div id="project-section" class="project-section page-hidden" style="display:none;">
    <button class="back-btn" onclick="navigateTo('work')">

  <!-- CONTACT -->
  <main id="contact-section" class="contact-grid page-hidden flex-1" style="display:none;">
    <div class="image-col">
      <img id="profile-photo" class="w-full h-full object-cover" loading="lazy" decoding="async" src="assets/images/profile.jpg" alt="Yanne Vicente" onerror="this.src='https://via.placeholder.com/800x800/cccccc/666666?text=Foto+de+Perfil'" width="800" height="800">
    </div>
    <div class="contact-content">
      <div>
        <h1 id="profile-name" class="leading-none tracking-tight" style="color: rgb(255, 189, 89); font-weight: 900; font-size: 57px; line-height: 0.9;"></h1>
        <p id="profile-subtitle" class="mt-2 tracking-widest uppercase" style="color: rgb(131, 147, 195); font-weight: 600; font-size: 23px;"></p>
        <div class="bio-wrapper" id="profile-bio"></div>
        <div class="social-buttons" id="social-buttons"></div>
        <div class="mt-8">
          <h3 style="color: rgb(131, 147, 195); font-weight: 800; font-size: 32px;">YOU CAN ALSO EMAIL ME</h3>
          <a id="email-link" class="inline-block mt-6 px-12 py-4 rounded-full font-semibold text-2xl hover:scale-105 transition-transform" href="mailto:" style="background: rgb(255, 189, 89); color: rgb(74, 74, 74); font-size: 22px;"></a>
        </div>
      </div>
      
      <section class="form-section">

            <label class="form-label block mb-1">E-mail*</label> 
            <input type="email" name="email" required placeholder="your@email.com">

            <textarea name="message" required rows="3" placeholder="Your message here..."></textarea>

          <button type="submit" class="submit-btn">SEND</button>

      navContact.classList.remove('active');

        projectSection.style.display = 'block';
        projectSection.classList.remove('page-hidden');

        workSection.classList.remove('page-hidden');
        navWork.classList.add('active');
        history.pushState(null, '', '#work');
        document.title = 'Yanne Vicente - Illustration';
      }
      window.scrollTo(0, 0);

    function getProjectTitle(slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      return project ? project.title : 'Project';

    // CARREGAR PROJETO
    // ========================================

      const project = siteData.portfolio.find(p => p.slug === slug);
      if (!project) { navigateTo('work'); return; }

      currentProjectId = project.id;
      currentImageIndex = 0;
      const container = document.getElementById('project-content');
      container.innerHTML = `<div class="loader-container"><div class="loader"></div></div>`;

      const hasMultiple = project.images && project.images.length > 1;
      const firstImage = project.coverImage || (project.images && project.images[0]) || '';

      let thumbnailsHtml = '';
      if (hasMultiple) {
        thumbnailsHtml = `
          <div class="carousel-thumbnails" id="carousel-thumbnails">
            ${project.images.map((img, idx) => `
              <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect fill='%23f5f5f5' width='80' height='80'/%3E%3C/svg%3E" 
                   data-src="${img}" 
                   alt="Thumbnail ${idx+1}" 
                   class="${idx === 0 ? 'active-thumb' : ''}"
                   onclick="changeProjectImage('${slug}', ${idx})">
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="project-layout">
          <div class="project-carousel">
            <div class="main-image-container" onclick="openZoom()">
              <img id="project-main-image" 
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800'%3E%3Crect fill='%23ffffff' width='800' height='800'/%3E%3C/svg%3E"

                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <button onclick="event.stopPropagation();nextProjectImage('${slug}')" id="carousel-next" class="${hasMultiple ? '' : 'hidden'}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
            
            ${thumbnailsHtml}

          <div class="project-info">

            <p class="client">${project.category} · ${project.year}</p>
            <hr class="divider">
            <div class="description">
              ${project.description.map(p => `<p>${p}</p>`).join('')}
            </div>
            <div class="footer-icons">
              <a href="https://instagram.com/yanne.vicente" target="_blank" rel="noopener" title="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                  <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
              </a>
              <a href="https://be.net/yannevicenteart" target="_blank" rel="noopener" title="Behance">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M22 7h-7v2h7V7zm1.72 6.88c0-3.64-2.22-5.96-5.85-5.96-3.48 0-6.15 2.5-6.15 6.06 0 3.75 2.59 6.2 6.27 6.2 2.65 0 4.88-1.27 5.76-3.75h-2.17c-.4.86-1.55 1.58-3.45 1.58-2.15 0-3.65-1.1-3.9-3.23h9.45c.03-.26.04-.57.04-.9zM14.07 12c.24-1.6 1.4-2.73 3.52-2.73 2.1 0 3.32 1.13 3.48 2.73h-7zM6.54 19.88H0V3.82h6.58c3.08 0 5.4 1.34 5.4 4.3 0 1.83-1.22 3.16-2.8 3.75 1.94.46 3.4 1.94 3.4 4.14 0 3.12-2.6 3.87-6.04 3.87zM2.85 9.77h3.18c1.37 0 2.22-.65 2.22-1.92 0-1.34-.94-1.87-2.3-1.87H2.85v3.79zm0 7.82h3.5c1.57 0 2.63-.64 2.63-2.15 0-1.5-1.06-2.07-2.58-2.07H2.85v4.22z"></path>
                </svg>
              </a>
              <button onclick="shareProject('${slug}')" title="Compartilhar">

      // Carrega imagem principal
      const mainImg = document.getElementById('project-main-image');
      if (mainImg && mainImg.dataset.src) {
        loadImage(mainImg.dataset.src, (url) => {
          mainImg.src = url;
          mainImg.removeAttribute('data-src');
        });
      }

      // Lazy loading das miniaturas
      if (hasMultiple) {
        const thumbs = document.querySelectorAll('#carousel-thumbnails img');
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const img = entry.target;
                if (img.dataset.src) {
                  loadImage(img.dataset.src, (url) => {
                    img.src = url;
                    img.removeAttribute('data-src');
                  });
                }
                observer.unobserve(img);
              }
            });
          }, { rootMargin: '50px' });
          thumbs.forEach(t => observer.observe(t));
        } else {
          thumbs.forEach(t => {
            if (t.dataset.src) {
              loadImage(t.dataset.src, (url) => { t.src = url; t.removeAttribute('data-src'); });
            }
          });
        }
      }
    }

    // ========================================
    // CARREGAR IMAGEM COM CACHE
    // ========================================
    function loadImage(src, callback) {
      if (imageCache[src]) { callback(imageCache[src]); return; }
      const img = new Image();
      img.onload = function() { imageCache[src] = src; callback(src); };
      img.onerror = function() { callback('https://via.placeholder.com/800x800/cccccc/666666?text=Imagem+não+encontrada'); };
      img.src = src;
    }

    // ========================================
    // CONTROLES DO CARROSSEL
    // ========================================
    function changeProjectImage(slug, index) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      if (!project || !project.images || index >= project.images.length) return;

      currentImageIndex = index;
      const mainImg = document.getElementById('project-main-image');
      const src = project.images[index];
      
      mainImg.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"%3E%3Crect fill="%23ffffff" width="800" height="800"/%3E%3C/svg%3E';
      loadImage(src, (url) => { mainImg.src = url; });

      const thumbs = document.querySelectorAll('#carousel-thumbnails img');
      thumbs.forEach((t, i) => t.classList.toggle('active-thumb', i === index));
    }

    function prevProjectImage(slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      if (!project || !project.images || project.images.length <= 1) return;
      const idx = (currentImageIndex - 1 + project.images.length) % project.images.length;
      changeProjectImage(slug, idx);
    }

    function nextProjectImage(slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      if (!project || !project.images || project.images.length <= 1) return;
      const idx = (currentImageIndex + 1) % project.images.length;
      changeProjectImage(slug, idx);
    }

    // ========================================
    // ZOOM DA IMAGEM
    // ========================================
    function openZoom() {
      const mainImg = document.getElementById('project-main-image');
      if (!mainImg || !mainImg.src || mainImg.src.includes('placeholder')) return;
      
      const zoomModal = document.getElementById('zoomModal');
      const zoomImg = document.getElementById('zoomImage');
      zoomImg.src = mainImg.src;
      zoomModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeZoom() {
      document.getElementById('zoomModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // ========================================
    // COMPARTILHAR
    // ========================================
    function shareProject(slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      if (!project) return;
      
      const shareUrl = window.location.origin + window.location.pathname + '?project=' + slug;
      
      if (navigator.share) {
        navigator.share({ title: project.title, text: `Confira o projeto "${project.title}" por Yanne Vicente!`, url: shareUrl })
          .catch(err => { if (err.name !== 'AbortError') copyToClipboard(shareUrl); });
      } else {
        copyToClipboard(shareUrl);
      }
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Link copiado! ✨'))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('Link copiado! ✨'); } 
      catch(e) { showToast('Copie manualmente: ' + text); }
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timeout);
      t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ========================================
    // RENDERIZAR PORTFÓLIO
    // ========================================
    function renderPortfolio() {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '';
      const placeholder = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"%3E%3Crect fill="%23e8e6e4" width="400" height="400"/%3E%3C/svg%3E';
      
      siteData.portfolio.forEach(p => {
        grid.innerHTML += `
          <div class="portfolio-item" onclick="navigateTo('project', '${p.slug}')">
            <img loading="lazy" decoding="async" 
                 src="${placeholder}" 
                 data-src="${p.coverImage}" 
                 alt="${p.title}"
                 class="lazy-grid-img"
                 onerror="this.src='https://via.placeholder.com/800x800/cccccc/666666?text=Imagem+não+encontrada'"
                 width="400" height="400">
            <div class="overlay">
              <p class="font-bold text-base" style="color:white;">${p.title}</p>
              <p class="text-xs opacity-80 mt-1" style="color:rgba(255,255,255,0.8);">${p.category} · ${p.year}</p>
            </div>
          </div>
        `;
      });

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              if (img.dataset.src) {
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
                img.style.transition = 'opacity 0.5s ease';
                img.style.opacity = '0';
                setTimeout(() => { img.style.opacity = '1'; }, 50);
              }
              observer.unobserve(img);
            }
          });
        }, { rootMargin: '100px', threshold: 0.01 });
        document.querySelectorAll('.lazy-grid-img').forEach(img => observer.observe(img));
      }
    }

      });
    }

    // ========================================
    // FORMULÁRIO
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('contact-form');
      const success = document.getElementById('form-success-message');
      
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const data = new FormData(form);
        fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(r => {
          if (r.ok) {
            success.classList.add('show');
            form.reset();
            setTimeout(() => success.classList.remove('show'), 5000);
          } else {
            alert('Algo deu errado. Tente novamente!');
          }
        }).catch(() => alert('Algo deu errado. Tente novamente!'));
      });
    });

    // ========================================
    // ROTEAMENTO INICIAL
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      renderPortfolio();
      renderProfile();
      renderSocial();

      const hash = window.location.hash;
      const params = new URLSearchParams(window.location.search);
      const projectParam = params.get('project');

      if (projectParam) {
        navigateTo('project', projectParam);
      } else if (hash === '#contact') {
        navigateTo('contact');
      } else {
        navigateTo('work');
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (document.getElementById('zoomModal').classList.contains('active')) {
            closeZoom();
          } else if (document.getElementById('project-section').style.display !== 'none') {
            navigateTo('work');
          }
        }
        if (e.key === 'ArrowLeft' && document.getElementById('project-section').style.display !== 'none') {
          const slug = new URLSearchParams(window.location.search).get('project');
          if (slug) prevProjectImage(slug);
        }
        if (e.key === 'ArrowRight' && document.getElementById('project-section').style.display !== 'none') {
          const slug = new URLSearchParams(window.location.search).get('project');
          if (slug) nextProjectImage(slug);
        }
      });

      window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search).get('project');
        if (p) { navigateTo('project', p); }
        else if (window.location.hash === '#contact') { navigateTo('contact'); }
        else { navigateTo('work'); }
      });
    });
  </script>
</body>
</html>
