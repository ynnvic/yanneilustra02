<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg" href="/assets/images/favicon.svg">
  <title>Yanne Vicente - Illustration</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Usando uma fonte leve ou mantendo Poppins com pesos delicados -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    body { font-family: 'Poppins', sans-serif; background: #ffffff; color: #333333; }
    
    /* NAVEGAÇÃO ESTILO MART LETT (Centralizada e Limpa) */
    .navbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem 1.5rem 1rem;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .navbar-logo {
      margin-bottom: 1rem;
      text-align: center;
    }
    .navbar-logo img { height: 36px; width: auto; cursor: pointer; }
    .navbar-logo span {
      font-weight: 400;
      font-size: 32px;
      letter-spacing: 2px;
      color: #2c2c2c;
      font-family: serif; /* Estilo mais orgânico/editorial */
    }
    
    .navbar-menu { 
      display: flex; 
      align-items: center; 
      justify-content: center;
      gap: 2rem; 
      flex-wrap: wrap;
    }
    
    .nav-link { 
      transition: color 0.3s ease; 
      color: #777777;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      text-transform: lowercase; /* Visual artístico sutil */
    }
    .nav-link:hover { color: #111111 !important; }
    .nav-link.active { color: #111111 !important; font-weight: 500; }
    .page-hidden { display: none !important; }
    
    /* PÁGINA DE PROJETO */
    .project-section {
      background: #ffffff;
      min-height: calc(100vh - 80px);
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    
    .project-section .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #777;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.3s ease;
      background: none;
      border: none;
      font-size: 14px;
      padding: 20px 30px 10px 30px;
      flex-shrink: 0;
    }
    .project-section .back-btn:hover { color: #111; }
    
    .project-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      background: #ffffff;
      height: calc(100vh - 80px - 70px);
    }
    
    .project-carousel {
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 400px;
      height: 100%;
      overflow: hidden;
    }
    
    .project-carousel .main-image-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      position: relative;
      background: #ffffff;
      overflow: hidden;
      max-height: calc(100vh - 200px);
    }
    
    .project-carousel .main-image-container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    
    .carousel-controls {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
      z-index: 10;
    }
    
    .carousel-controls button {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ddd;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #333;
    }
    .carousel-controls button:hover { background: #000; color: #fff; border-color: #000; }
    .carousel-controls button.hidden { display: none !important; }
    
    .carousel-thumbnails {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 16px 20px 10px 20px;
      width: 100%;
      max-width: 90%;
      justify-content: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    
    .carousel-thumbnails img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.3s ease;
    }
    .carousel-thumbnails img:hover, .carousel-thumbnails img.active-thumb {
      opacity: 1;
    }
    
    .project-info {
      background: #ffffff;
      padding: 30px 35px 20px 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-left: 1px solid #f0f0f0;
      overflow-y: auto;
      height: 100%;
    }
    
    .project-info .title {
      color: #222;
      font-weight: 600;
      font-size: 24px;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .project-info .client {
      color: #888;
      font-weight: 400;
      font-size: 13px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .project-info .divider {
      border: none;
      border-top: 1px solid #eee;
      margin-bottom: 20px;
    }
    .project-info .description {
      color: #555;
      font-size: 14px;
      line-height: 1.8;
    }
    
    .project-info .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 14px;
      margin-top: 6px;
      border-top: 1px solid #eee;
    }
    .project-info .tags-container .tag {
      color: #888;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.5px;
      cursor: pointer;
      background: #f9f9f9;
      border: 1px solid #eee;
      padding: 4px 10px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .project-info .tags-container .tag:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    /* GALERIA ASSIMÉTRICA ESTILO PINTEREST / MART LETT */
    .portfolio-wrapper {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    /* Usando colunas CSS para criar o efeito assimétrico fluido */
    .portfolio-grid {
      column-count: 3;
      column-gap: 20px;
      width: 100%;
    }
    
    .portfolio-item { 
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative; 
      cursor: pointer;
      overflow: hidden;
      background: #f8f8f8;
    }
    
    .portfolio-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    
    .portfolio-item:hover img { 
      transform: scale(1.02); 
    }
    
    .portfolio-item .overlay {
      position: absolute; 
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end;
      padding: 1.5rem;
      opacity: 0; 
      transition: opacity 0.3s ease;
    }
    .portfolio-item:hover .overlay { opacity: 1; }
    
    @media (max-width: 1024px) {
      .portfolio-grid { column-count: 2; }
    }
    @media (max-width: 640px) {
      .portfolio-grid { column-count: 1; }
    }

    /* ABOUT & CONTACT GRID */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 120px);
    }
    .about-grid .image-col {
      background: #f8f8f8;
      overflow: hidden;
    }
    .about-grid .image-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .about-grid .about-content {
      padding: 4rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; }
      .about-grid .image-col { height: 400px; }
      .about-grid .about-content { padding: 2rem; }
    }
    
    .bio-wrapper p {
      color: #555;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .form-section {
      background-color: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 30px;
      margin-top: 30px;
    }
    .form-section input,
    .form-section textarea {
      background: #ffffff;
      border: 1px solid #ddd;
      color: #333;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 5px;
    }
    .form-section input:focus,
    .form-section textarea:focus {
      outline: none;
      border-color: #111;
    }
    .form-section .submit-btn {
      background: #111;
      color: #fff;
      padding: 12px 30px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
    }
    .form-section .submit-btn:hover { background: #333; }

    /* Outros ajustes visuais limpos */
    .footer-clean {
      background: #ffffff;
      border-top: 1px solid #eee;
      padding: 2rem 0;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
    
    .zoom-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 40px;
    }
    .zoom-modal.active { opacity: 1; pointer-events: auto; }
    .zoom-modal img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
    .close-zoom { position: fixed; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer; color: #111; }
  </style>
</head>

<body class="w-full min-h-screen flex flex-col">

  <!-- NAVEGAÇÃO MINIMALISTA ESTILO MART LETT -->
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="/assets/images/logo.svg" alt="Yanne Vicente" onclick="goToHome()" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';" width="40" height="40">
      <span id="logo-fallback" class="cursor-pointer" style="display: none;" onclick="goToHome()">yanne vicente</span>
    </div>
    <div class="navbar-menu">
      <a onclick="goToHome()" class="nav-link active" id="nav-work">portfolio</a>
      <a onclick="navigateTo('editorial')" class="nav-link" id="nav-editorial">editorial & covers</a>
      <a onclick="navigateTo('about')" class="nav-link" id="nav-about">about & contact</a>
      <a onclick="navigateTo('blog')" class="nav-link" id="nav-blog">blog</a>
    </div>
  </nav>

  <!-- WRAPPER DE PROJETOS -->
  <div id="project-wrapper" class="project-wrapper page-hidden" style="display:none;">
    <div id="project-section" class="project-section">
      <button class="back-btn" onclick="goBackFromProject()">
        ← back
      </button>
      <div id="project-content" style="flex:1;display:flex;flex-direction:column;">
        <div class="loader-container"><div class="loader"></div></div>
      </div>
    </div>
  </div>

  <!-- PORTFÓLIO / GALERIA ASSIMÉTRICA -->
  <main id="work-section" class="w-full flex-1">
    <section class="portfolio-wrapper">
      <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>
  </main>

  <!-- BLOG -->
  <main id="blog-section" class="page-hidden flex-1" style="display:none;">
    <section class="portfolio-wrapper" style="max-width:1000px;">
      <div id="blog-grid" class="blog-grid">
        <div class="loader-container"><div class="loader"></div></div>
      </div>
    </section>
  </main>

  <!-- ABOUT & CONTACT -->
  <main id="about-section" class="about-grid page-hidden flex-1" style="display:none;">
    <div class="image-col">
      <img id="profile-photo" class="w-full h-full object-cover" loading="lazy" src="/assets/images/profile.jpg" alt="Yanne Vicente">
    </div>
    <div class="about-content">
      <div>
        <h1 id="profile-name" style="font-size: 32px; font-weight: 500; color: #111; margin-bottom: 5px;"></h1>
        <p id="profile-subtitle" style="color: #888; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px;"></p>
        <div class="bio-wrapper" id="profile-bio"></div>
        <div class="social-buttons" style="display: flex; gap: 15px; margin-top: 25px;" id="social-buttons"></div>
      </div>
      
      <section class="form-section">
        <h3 style="color: #111; font-weight: 600; font-size: 16px; margin-bottom: 15px;">Send a message</h3>
        <div id="form-success-message" class="form-success mt-2" style="background:#e6f4ea; color:#137333; padding:10px; border-radius:4px; display:none;">Message sent successfully!</div>
        <form id="contact-form" class="space-y-3" action="https://formspree.io/f/mgogvbke" method="POST">
          <div>
            <label style="font-size: 12px; color: #666; font-weight: 500;">Email*</label> 
            <input type="email" name="email" required placeholder="your@email.com">
          </div>
          <div>
            <label style="font-size: 12px; color: #666; font-weight: 500;">Message*</label> 
            <textarea name="message" required rows="3" placeholder="Your message..."></textarea>
          </div>
          <button type="submit" class="submit-btn">Send</button>
        </form>
      </section>
    </div>
  </main>

  <!-- MODAL DE ZOOM -->
  <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
    <button class="close-zoom" onclick="closeZoom()">×</button>
    <img id="zoomImage" src="" alt="Zoom">
  </div>

  <!-- FOOTER -->
  <footer class="footer-clean">
    <p>© 2026 Yanne Vicente. All Rights Reserved.</p>
  </footer>

  <script>
    const siteData = {
      portfolio: [
        {
          id: 1, slug: "winnies-flying-guide", title: "Winnie's Flying Guide", category: "Children's picture book", year: 2024, isEditorial: true,
          tags: ["CHILDREN'S BOOK", "EDITORIAL", "CARTOON ART"],
          description: ["Winnie's Flying Guide is a poetry picture book for children ages 4 to 6 explores themes of belonging and friendship."],
          coverImage: "/assets/images/projeto1.jpg", carouselImages: ["/assets/images/projeto1_1.jpg", "/assets/images/projeto1_2.jpg"]
        },
        {
          id: 2, slug: "captain-octopus-sailorboy", title: "Captain Octopus & Sailorboy", category: "Children's Book Cover", year: 2022, isEditorial: true,
          tags: ["BOOK COVER", "EDITORIAL"], description: ["A children's cover book illustration concept."],
          coverImage: "/assets/images/projeto2.jpg", carouselImages: ["/assets/images/projeto2_1.jpg"]
        },
        {
          id: 3, slug: "safari-wallpaper", title: "Safari Wallpaper", category: "Illustration", year: 2024, isEditorial: false,
          tags: ["ILLUSTRATION", "SAFARI"], description: ["Children's wallpapers for interior design catalogue."],
          coverImage: "/assets/images/projeto3.jpg", carouselImages: ["/assets/images/projeto3_1.jpg"]
        },
        {
          id: 4, slug: "childrens-school-illustration", title: "School Illustration", category: "Illustration", year: 2025, isEditorial: false,
          tags: ["ILLUSTRATION", "MURAL"], description: ["Corridor decorations across school campuses."],
          coverImage: "/assets/images/projeto4.jpg", carouselImages: ["/assets/images/projeto4_1.jpg"]
        },
        {
          id: 5, slug: "stellar-cafe", title: "Stellar Cafe", category: "Webcomic", year: 2022, isEditorial: true,
          tags: ["EDITORIAL", "WEBCOMIC"], description: ["Sci-fi romance webcomic."],
          coverImage: "/assets/images/projeto5.jpg", carouselImages: ["/assets/images/projeto5_1.jpg"]
        },
        {
          id: 6, slug: "character-illustration-pack", title: "Character Pack", category: "Character Design", year: 2022, isEditorial: false,
          tags: ["CHARACTER DESIGN"], description: ["Commissioned character design pack."],
          coverImage: "/assets/images/projeto6.jpg", carouselImages: ["/assets/images/projeto6_1.jpg"]
        }
      ],
      profile: {
        name: "Yanne Vicente",
        subtitle: "Illustrator & Visual Storyteller",
        bio: ["I'm a non-binary illustrator based in Recife, Brazil, dedicated to making the world a bit more colorful, one drawing at a time."],
        photo: "/assets/images/profile.jpg",
        email: "yanne.vicentepaz@gmail.com"
      },
      social: {
        instagram: "https://instagram.com/yanne.vicente",
        linkedin: "https://linkedin.com/in/yannevicente"
      }
    };

    let currentImageIndex = 0;
    let isEditorialPage = false;

    function goToHome() {
      isEditorialPage = false;
      togglePages('work-section');
      document.getElementById('nav-work').classList.add('active');
      document.getElementById('nav-editorial').classList.remove('active');
      document.getElementById('nav-about').classList.remove('active');
      document.getElementById('nav-blog').classList.remove('active');
      renderPortfolio(siteData.portfolio);
      history.pushState(null, '', '/');
    }

    function navigateTo(page, slug) {
      if (page === 'project' && slug) {
        togglePages('project-wrapper');
        loadProject(slug);
        history.pushState(null, '', '/project/' + slug);
      } else if (page === 'editorial') {
        isEditorialPage = true;
        togglePages('work-section');
        document.getElementById('nav-editorial').classList.add('active');
        document.getElementById('nav-work').classList.remove('active');
        document.getElementById('nav-about').classList.remove('active');
        document.getElementById('nav-blog').classList.remove('active');
        renderPortfolio(siteData.portfolio.filter(p => p.isEditorial));
        history.pushState(null, '', '/editorial');
      } else if (page === 'about') {
        togglePages('about-section');
        document.getElementById('nav-about').classList.add('active');
        document.getElementById('nav-work').classList.remove('active');
        document.getElementById('nav-editorial').classList.remove('active');
        document.getElementById('nav-blog').classList.remove('active');
        history.pushState(null, '', '/about');
      } else if (page === 'blog') {
        togglePages('blog-section');
        document.getElementById('nav-blog').classList.add('active');
        document.getElementById('nav-work').classList.remove('active');
        document.getElementById('nav-editorial').classList.remove('active');
        document.getElementById('nav-about').classList.remove('active');
        history.pushState(null, '', '/blog');
      }
      window.scrollTo(0, 0);
    }

    function togglePages(activeId) {
      ['work-section', 'project-wrapper', 'about-section', 'blog-section'].forEach(id => {
        const el = document.getElementById(id);
        if (id === activeId) {
          el.style.display = id === 'project-wrapper' ? 'flex' : (id === 'about-section' ? 'grid' : 'block');
          el.classList.remove('page-hidden');
        } else {
          el.style.display = 'none';
          el.classList.add('page-hidden');
        }
      });
    }

    function renderPortfolio(projects) {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = projects.map(p => `
        <div class="portfolio-item" onclick="navigateTo('project', '${p.slug}')">
          <img loading="lazy" src="${p.coverImage}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/600x800/eee/999?text=Art'">
          <div class="overlay">
            <p style="color:white; font-weight:500; font-size:14px;">${p.title}</p>
            <p style="color:rgba(255,255,255,0.7); font-size:11px; margin-top:2px;">${p.category}</p>
          </div>
        </div>
      `).join('');
    }

    function loadProject(slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      if (!project) return goToHome();
      currentImageIndex = 0;
      const container = document.getElementById('project-content');
      const images = project.carouselImages || [project.coverImage];
      
      container.innerHTML = `
        <div class="project-layout">
          <div class="project-carousel">
            <div class="main-image-container" onclick="openZoom()">
              <img id="project-main-image" src="${images[0]}" alt="${project.title}">
            </div>
            ${images.length > 1 ? `
              <div class="carousel-controls">
                <button onclick="changeImg(-1, '${slug}')">‹</button>
                <button onclick="changeImg(1, '${slug}')">›</button>
              </div>
              <div class="carousel-thumbnails">
                ${images.map((img, idx) => `<img src="${img}" class="${idx === 0 ? 'active-thumb' : ''}" onclick="setImg(${idx}, '${slug}')">`).join('')}
              </div>` : ''}
          </div>
          <div class="project-info">
            <h2 class="title">${project.title}</h2>
            <p class="client">${project.category} · ${project.year}</p>
            <hr class="divider">
            <div class="description">${project.description.map(d => `<p>${d}</p>`).join('')}</div>
            <div class="tags-container">${project.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
        </div>
      `;
    }

    function changeImg(direction, slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      const images = project.carouselImages;
      currentImageIndex = (currentImageIndex + direction + images.length) % images.length;
      document.getElementById('project-main-image').src = images[currentImageIndex];
    }

    function setImg(index, slug) {
      const project = siteData.portfolio.find(p => p.slug === slug);
      currentImageIndex = index;
      document.getElementById('project-main-image').src = project.carouselImages[index];
    }

    function openZoom() {
      const mainImg = document.getElementById('project-main-image');
      document.getElementById('zoomImage').src = mainImg.src;
      document.getElementById('zoomModal').classList.add('active');
    }

    function closeZoom() {
      document.getElementById('zoomModal').classList.remove('active');
    }

    function goBackFromProject() {
      if (isEditorialPage) navigateTo('editorial');
      else goToHome();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPortfolio(siteData.portfolio);
      const p = siteData.profile;
      document.getElementById('profile-name').textContent = p.name;
      document.getElementById('profile-subtitle').textContent = p.subtitle;
      document.getElementById('profile-bio').innerHTML = p.bio.map(b => `<p>${b}</p>`).join('');
    });
  </script>
</body>
</html>
