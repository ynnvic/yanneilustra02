<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yanne Vicente - Portfolio</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .nav-link { 
      transition: color 0.3s ease; 
      color: rgb(131, 147, 195);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-link:hover { color: #fec643 !important; }
    .nav-link.active { color: #fec643 !important; }
    .page-hidden { display: none !important; }

    /* NAVEGAÇÃO */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(250, 249, 247, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200, 200, 200, 0.3);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .navbar-logo {
      flex-shrink: 0;
    }
    .navbar-logo img {
      height: 40px;
      width: auto;
      cursor: pointer;
    }
    .navbar-menu {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .navbar-menu .menu-icon-link {
      color: rgb(131, 147, 195);
      transition: color 0.3s ease, transform 0.3s ease;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
    }
    .navbar-menu .menu-icon-link:hover {
      color: #fec643;
      transform: scale(1.1);
    }
    @media (max-width: 640px) {
      .navbar {
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
      }
      .navbar-menu {
        gap: 1rem;
      }
      .navbar-menu .menu-icon-link {
        font-size: 16px;
      }
      .nav-link {
        font-size: 13px;
      }
    }

    /* GRADE DE PROJETOS */
    .portfolio-wrapper {
      width: 100%;
      max-width: 100%;
      padding: 30px 30px 10px 30px;
      margin: 0;
    }

    .portfolio-grid {
      gap: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
    }

    .portfolio-item { 
      position: relative; 
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1/1;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: box-shadow 0.4s ease;
      background: #e8e6e4;
    }
    .portfolio-item:hover { 
      box-shadow: 0 16px 48px rgba(0,0,0,0.15);
    }
    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      border-radius: 16px;
    }
    .portfolio-item:hover img { transform: scale(1.05); }
    .portfolio-item .overlay {
      position: absolute; 
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 50%, transparent 70%);
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end;
      padding: 1.5rem;
      opacity: 0; 
      transition: opacity 0.4s ease;
      border-radius: 16px;
    }
    .portfolio-item:hover .overlay { opacity: 1; }
    
    /* BANNER */
    .banner-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: #e8e6e4;
      min-height: 100px;
    }
    .banner-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        flex: 1;
        height: 100vh;
        overflow: hidden;
    }
    @media (max-width: 768px) {
        .split-layout { 
          grid-template-columns: 1fr;
          height: auto;
          overflow: visible;
        }
    }

    .image-col { 
      position: sticky; 
      top: 0; 
      height: 100vh; 
      overflow: hidden; 
      background: #e8e6e4;
    }
    .image-col img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    @media (max-width: 768px) {
        .image-col { 
          position: relative; 
          height: 50vh; 
        }
        .split-layout {
          height: auto;
          overflow: visible;
        }
    }
    
    .contact-content {
      overflow-y: auto;
      height: 100vh;
      padding: 2rem 3rem 2rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    @media (max-width: 768px) {
      .contact-content {
        height: auto;
        overflow-y: visible;
        padding: 2rem 1.5rem;
      }
    }
    
    .bio-wrapper {
      max-width: 550px;
      width: 100%;
    }
    .bio-wrapper p {
      color: rgb(74, 74, 74);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    
    .social-buttons { display: flex; gap: 20px; margin-top: 40px; }
    .icon-link {
        font-size: 35px; color: #ffbd59; text-decoration: none;
        transition: transform 0.3s ease, color 0.3s ease;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-link:hover { transform: translateY(-5px); }
    .instagram:hover { color: #E1306C; }
    .linkedin:hover { color: #0077B5; }
    .bluesky:hover { color: #0085ff; }
    .x-twitter:hover { color: #000000; }

    @media (max-width: 1024px) {
      .portfolio-grid { 
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .portfolio-wrapper {
        padding: 24px 20px 10px 20px;
      }
    }
    @media (max-width: 640px) {
      .portfolio-grid { 
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .portfolio-wrapper {
        padding: 16px 16px 10px 16px;
      }
      .portfolio-item {
        border-radius: 12px;
      }
      .bio-wrapper {
        max-width: 100%;
      }
    }

    /* ======================================== */
    /* ESTILOS DO MODAL - OTIMIZADOS */
    /* ======================================== */
    
    /* Fundo do modal */
    .modal-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
    }
    
    /* Container principal do modal */
    .modal-content-wrapper {
      display: flex;
      flex-direction: row;
      max-height: 92vh;
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      border: 5px solid #ffffff;
    }
    
    /* Lado esquerdo - imagem */
    .modal-image-side {
      flex: 0 0 60%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 500px;
      overflow: hidden;
    }
    .modal-image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Lado direito - informações */
    .modal-info-side {
      flex: 0 0 40%;
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      overflow-y: auto;
    }
    
    /* Botão fechar - SEMPRE VISÍVEL */
    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      color: #4a4a4a;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .modal-close-btn:hover {
      background: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .modal-close-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.5;
    }
    
    /* Botões de navegação - só aparecem se houver mais de 1 imagem */
    .modal-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
      color: #4a4a4a;
    }
    .modal-nav-btn:hover {
      background: #ffffff;
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .modal-nav-btn.hidden {
      display: none !important;
    }
    .modal-nav-btn.prev { left: 16px; }
    .modal-nav-btn.next { right: 16px; }
    .modal-nav-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.5;
    }
    
    /* Miniaturas */
    .modal-thumbnails {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: thin;
      background: rgba(0,0,0,0.05);
      border-top: 1px solid rgba(255,255,255,0.1);
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 15;
      opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-image-side:hover .modal-thumbnails {
  opacity: 1;
}
    .modal-thumbnails::-webkit-scrollbar {
      height: 4px;
    }
    .modal-thumbnails::-webkit-scrollbar-thumb {
      background: #fec643;
      border-radius: 4px;
    }
    .modal-thumbnails img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      flex-shrink: 0;
      background: #f0efed;
    }
    .modal-thumbnails img:hover {
      border-color: #fec643;
      transform: scale(1.05);
    }
    .modal-thumbnails img.active-thumb {
      border-color: #fec643;
      box-shadow: 0 0 0 2px #fec643;
    }
    
    /* Títulos do modal - cor #8d9bc7 */
    .modal-title {
      color: #8d9bc7 !important;
      font-weight: 800;
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .modal-client {
      color: #aab0c4;
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .modal-divider {
      border: none;
      border-top: 2px solid #f0f0f5;
      margin-bottom: 20px;
    }
    .modal-description {
      color: #4a4a4a;
      font-size: 14px;
      line-height: 1.8;
    }
    .modal-description p {
      margin-bottom: 12px;
    }
    .modal-description p:last-child {
      margin-bottom: 0;
    }
    
    /* Rodapé do modal com ícones sociais */
    .modal-footer-icons {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f5;
    }
    .modal-footer-icons a {
      color: #c5c9d6;
      transition: color 0.3s ease;
    }
    .modal-footer-icons a:hover {
      color: #fec643;
    }
    
    @media (max-width: 768px) {
      .modal-content-wrapper {
        flex-direction: column;
        max-height: 95vh;
        border-radius: 16px;
      }
      .modal-image-side {
        flex: 0 0 55%;
        min-height: 300px;
      }
      .modal-info-side {
        flex: 0 0 45%;
        padding: 1.5rem;
      }
      .modal-title {
        font-size: 22px;
      }
      .modal-close-btn {
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
      }
      .modal-nav-btn {
        width: 36px;
        height: 36px;
      }
      .modal-nav-btn.prev { left: 8px; }
      .modal-nav-btn.next { right: 8px; }
      .modal-thumbnails img {
        width: 44px;
        height: 44px;
      }
    }
    @media (max-width: 480px) {
      .modal-image-side {
        flex: 0 0 45%;
        min-height: 220px;
      }
      .modal-info-side {
        padding: 1rem 1.25rem;
      }
      .modal-title {
        font-size: 18px;
      }
      .modal-client {
        font-size: 12px;
      }
      .modal-description {
        font-size: 13px;
      }
    }

    .footer-yellow {
      background-color: #fec643 !important;
      padding: 1.5rem 0 !important;
    }
    .footer-yellow p {
      color: #4a4a4a !important;
    }

    .form-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }
    .form-success.show {
      display: block;
    }

    .section-header {
      margin-bottom: 28px;
    }
    .section-header h2 {
      color: rgb(131, 147, 195);
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    @media (max-width: 640px) {
      .section-header h2 {
        font-size: 28px;
      }
    }

    /* FORMULÁRIO COM BG #8393c3 */
    .form-section {
      background-color: #8393c3;
      border-radius: 20px;
      padding: 30px 32px;
      margin-top: 20px;
      width: 100%;
      max-width: 550px;
    }
    .form-section h2 {
      color: #ffffff;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.3px;
    }
    .form-section .form-label {
      color: rgba(255,255,255,0.85);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-section input,
    .form-section textarea {
      background: rgba(255,255,255,0.2);
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      color: #ffffff;
      padding: 10px 0;
      width: 100%;
      transition: border-color 0.3s ease;
      font-size: 14px;
    }
    .form-section input:focus,
    .form-section textarea:focus {
      outline: none;
      border-bottom-color: #ffffff;
      background: rgba(255,255,255,0.1);
    }
    .form-section input::placeholder,
    .form-section textarea::placeholder {
      color: rgba(255,255,255,0.5);
    }
    .form-section .submit-btn {
      background: #fec643;
      color: #4a4a4a;
      padding: 12px 40px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .form-section .submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .form-section .form-success {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.3);
    }
    @media (max-width: 640px) {
      .form-section {
        padding: 20px;
        border-radius: 16px;
      }
      .form-section h2 {
        font-size: 20px;
      }
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      height: 100%;
    }
    .contact-grid .image-col {
      height: 100vh;
      position: sticky;
      top: 0;
    }
    .contact-grid .contact-content {
      height: 100vh;
      overflow-y: auto;
      padding: 2rem 3rem;
    }
    @media (max-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .contact-grid .image-col {
        height: 50vh;
        position: relative;
      }
      .contact-grid .contact-content {
        height: auto;
        overflow-y: visible;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body class="w-full min-h-screen flex flex-col" style="background: rgb(250, 249, 247);">
  
  <!-- NAVEGAÇÃO -->
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="assets/images/logo.png" alt="Yanne Vicente Logo" class="logo-img" onclick="switchPage('work')" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
      <span id="logo-fallback" class="text-2xl font-bold cursor-pointer" style="color: #fec643; display: none;" onclick="switchPage('work')">YV</span>
    </div>
    
    <div class="navbar-menu">
      <a href="https://wa.me/+5581996385618" target="_blank" rel="noopener" class="menu-icon-link" title="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
      <a href="https://instagram.com/yanne.vicente" target="_blank" rel="noopener" class="menu-icon-link" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a onclick="switchPage('work')" class="nav-link" id="nav-work">WORK</a>
      <a onclick="switchPage('contact')" class="nav-link" id="nav-contact">CONTACT</a>
    </div>
  </nav>

  <!-- WORK -->
  <main id="work-section" class="w-full flex-1">
    <div class="banner-container">
      <img src="assets/images/banner1.jpg" alt="Banner" loading="lazy" decoding="async">
    </div>
    
    <section class="portfolio-wrapper">
      <div class="section-header">
        <h2>Professional doodler for tiny humans    :) ✨</h2>
      </div>
      <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>
  </main>

  <!-- CONTACT -->
  <main id="contact-section" class="contact-grid page-hidden flex-1">
    <div class="image-col">
      <img id="profile-photo" class="w-full h-full object-cover" loading="lazy" decoding="async" src="assets/images/profile.jpg" alt="Yanne Vicente" onerror="this.src='https://via.placeholder.com/800x800/cccccc/666666?text=Foto+de+Perfil'">
    </div>
    
    <div class="contact-content">
      <div>
        <h1 id="profile-name" class="leading-none tracking-tight" style="color: rgb(255, 189, 89); font-weight: 900; font-size: 57px; line-height: 0.9;"></h1>
        <p id="profile-subtitle" class="mt-2 tracking-widest uppercase" style="color: rgb(131, 147, 195); font-weight: 600; font-size: 23px;"></p>
        
        <div class="bio-wrapper" id="profile-bio"></div>
        
        <div class="social-buttons" id="social-buttons"></div>
        
        <div class="mt-8">
          <h3 style="color: rgb(131, 147, 195); font-weight: 800; font-size: 32px;">YOU CAN ALSO EMAIL ME</h3>
          <a id="email-link" class="inline-block mt-6 px-12 py-4 rounded-full font-semibold text-2xl hover:scale-105 transition-transform" href="mailto:" style="background: rgb(255, 189, 89); color: rgb(74, 74, 74); font-size: 22px;"></a>
        </div>
      </div>
      
      <section class="form-section">
        <h2 style="color: rgb(253, 254, 255); font-weight: 800; font-size: 32px;">OR KINDLY SEND<br>ME A MESSAGE!✨</h2>

        
        <div id="form-success-message" class="form-success mt-4">
          Your message was successfully sent! :) ✨
        </div>
        
        <div data-fs-error class="mt-4 p-3 bg-red-500/20 text-white rounded-lg hidden font-medium text-sm">Something went wrong... Try it once more! :)</div>

        <form id="contact-form" class="mt-4 space-y-4" action="https://formspree.io/f/mgogvbke" method="POST">
          <div>
            <label class="form-label block mb-1">E-mail*</label> 
            <input type="email" name="email" required placeholder="your@email.com">
          </div>
          <div>
            <label class="form-label block mb-1">Message*</label> 
            <textarea name="message" required rows="3" placeholder="Your message here..."></textarea>
          </div>
          <button type="submit" class="submit-btn">SEND</button>
        </form>
      </section>
    </div>
  </main>

  <!-- MODAL - NOVO LAYOUT -->
  <div id="projectModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="absolute inset-0 modal-overlay" onclick="closeProjectModal()"></div>
    
    <div class="modal-content-wrapper">
      <!-- Botão Fechar - SEMPRE VISÍVEL -->
      <button onclick="closeProjectModal()" class="modal-close-btn" aria-label="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      
      <!-- Lado da Imagem -->
      <div class="modal-image-side" id="modalImageSide">
        <img id="modalImage" src="" alt="Projeto" loading="lazy" decoding="async">
        
        <!-- Botões de navegação - escondidos por padrão, JS controla visibilidade -->
        <button onclick="prevModalImage()" class="modal-nav-btn prev" id="modalPrevBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button onclick="nextModalImage()" class="modal-nav-btn next" id="modalNextBtn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        
        <!-- Miniaturas -->
        <div class="modal-thumbnails" id="modal-thumbnails"></div>

    let currentProjectIndex = 0;

    // ========================================
    // RENDERIZA O PORTFÓLIO
    // ========================================
    function renderPortfolio() {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '';
      siteData.portfolio.forEach((project, index) => {
        const thumbImage = project.gradeImage || 'https://via.placeholder.com/800x800/cccccc/666666?text=Sem+imagem';
        grid.innerHTML += `
          <div class="portfolio-item" onclick="openProjectModal(${index})">
            <img loading="lazy" decoding="async" src="${thumbImage}" alt="${project.title}" onerror="this.src='https://via.placeholder.com/800x800/cccccc/666666?text=Imagem+não+encontrada'">
            <div class="overlay">
              <p class="font-bold text-base" style="color: white;">${project.title}</p>
              <p class="text-xs opacity-80 mt-1" style="color: rgba(255,255,255,0.8);">${project.category} · ${project.year}</p>
            </div>
          </div>
        `;
      });
    }

    // ========================================
    // RENDERIZA O PERFIL
    // ========================================
    function renderProfile(profile) {
      document.getElementById('profile-name').textContent = profile.name;
      document.getElementById('profile-subtitle').textContent = profile.subtitle;
      
      const profilePhoto = document.getElementById('profile-photo');
      profilePhoto.src = profile.photo + '?t=' + new Date().getTime();
      profilePhoto.onerror = function() {
        this.src = 'https://via.placeholder.com/800x800/cccccc/666666?text=Foto+de+Perfil';
      };
      
      const bioContainer = document.getElementById('profile-bio');
      bioContainer.innerHTML = '';
      profile.bio.forEach(text => {
        bioContainer.innerHTML += `<p>${text}</p>`;
      });
      document.getElementById('email-link').href = `mailto:${profile.email}`;
      document.getElementById('email-link').textContent = profile.email;
    }

    // ========================================
    // RENDERIZA REDES SOCIAIS
    // ========================================
    function renderSocial(social) {
      const container = document.getElementById('social-buttons');
      container.innerHTML = '';
      const icons = {
        instagram: 'fa-brands fa-instagram',
        linkedin: 'fa-brands fa-linkedin',
        bluesky: 'fa-brands fa-bluesky',
        twitter: 'fa-brands fa-x-twitter'
      };
      Object.keys(social).forEach(key => {
        if (social[key]) {
          container.innerHTML += `<a href="${social[key]}" target="_blank" rel="noopener" class="icon-link ${key}"><i class="${icons[key]}"></i></a>`;
        }
      });
    }

    // ========================================
    // FUNÇÕES DO MODAL - ATUALIZADAS
    // ========================================
    function openProjectModal(index) {
      currentProjectIndex = index;
      currentImageIndex = 0;
      updateModalContent();
      const modal = document.getElementById('projectModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100', 'pointer-events-auto');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      const modal = document.getElementById('projectModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100', 'pointer-events-auto');
      document.body.style.overflow = 'auto';
    }

    function prevModalImage() {
      const project = siteData.portfolio[currentProjectIndex];
      if (!project.carouselImages || project.carouselImages.length <= 1) return;
      
      currentImageIndex = (currentImageIndex - 1 + project.carouselImages.length) % project.carouselImages.length;
      updateModalContent();
    }

    function nextModalImage() {
      const project = siteData.portfolio[currentProjectIndex];
      if (!project.carouselImages || project.carouselImages.length <= 1) return;
      
      currentImageIndex = (currentImageIndex + 1) % project.carouselImages.length;
      updateModalContent();
    }

    function updateModalContent() {
      const project = siteData.portfolio[currentProjectIndex];
      const images = project.carouselImages || [];
      const hasMultipleImages = images.length > 1;
      
      // Atualiza imagem principal
      if (images.length === 0) {
        document.getElementById('modalImage').src = project.gradeImage;
      } else {
        const imageIndex = currentImageIndex % images.length;
        document.getElementById('modalImage').src = images[imageIndex];
      }
      
      document.getElementById('modalImage').onerror = function() {
        this.src = 'https://via.placeholder.com/800x800/cccccc/666666?text=Imagem+não+encontrada';
      };
      
      // Atualiza título (cor #8d9bc7 aplicada via CSS)
      document.getElementById('modalTitle').textContent = project.title;
      document.getElementById('modalClient').textContent = `${project.category} · ${project.year}`;
      
      // Atualiza descrição
      const descContainer = document.getElementById('modalDescription');
      descContainer.innerHTML = '';
      if (project.description && project.description.length > 0) {
        project.description.forEach(text => {
          descContainer.innerHTML += `<p>${text}</p>`;
        });
      } else {
        descContainer.innerHTML = `<p>${project.description || 'Sem descrição disponível.'}</p>`;
      }
      
      // Controla visibilidade dos botões de navegação
      const prevBtn = document.getElementById('modalPrevBtn');
      const nextBtn = document.getElementById('modalNextBtn');
      
      if (hasMultipleImages) {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
      } else {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      }
      
      // Renderiza miniaturas
      renderThumbnails(images);
    }

    function renderThumbnails(images) {
      const container = document.getElementById('modal-thumbnails');
      container.innerHTML = '';
      
      if (!images || images.length === 0) {
        container.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 12px; padding: 4px 8px;">Sem imagens adicionais</span>';
        return;
      }
      
      images.forEach((img, index) => {
        const thumb = document.createElement('img');
        thumb.src = img;
        thumb.alt = `Thumbnail ${index + 1}`;
        thumb.className = index === currentImageIndex ? 'active-thumb' : '';
        thumb.onerror = function() {
          this.src = 'https://via.placeholder.com/60x60/cccccc/666666?text=?';
        };
        thumb.onclick = () => {
          currentImageIndex = index;
          updateModalContent();
        };
        container.appendChild(thumb);
      });
    }

    // ========================================
    // NAVEGAÇÃO
    // ========================================
    function switchPage(page) {
      const workSection = document.getElementById('work-section');
      const contactSection = document.getElementById('contact-section');
      const navWork = document.getElementById('nav-work');
      const navContact = document.getElementById('nav-contact');
      
      navWork.classList.remove('active');
      navContact.classList.remove('active');
      
      if (page === 'contact') {
        workSection.classList.add('page-hidden');
        contactSection.classList.remove('page-hidden');
        navContact.classList.add('active');
        history.pushState(null, '', '#contact');
      } else {
        workSection.classList.remove('page-hidden');
        contactSection.classList.add('page-hidden');
        navWork.classList.add('active');
        history.pushState(null, '', '#work');
      }
      window.scrollTo(0, 0);
    }

    // ========================================
    // FORMULÁRIO DE CONTATO
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('contact-form');
      const successMessage = document.getElementById('form-success-message');
      
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(form);
        
        fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        }).then(response => {
          if (response.ok) {
            successMessage.classList.add('show');
            form.reset();
            setTimeout(() => {
              successMessage.classList.remove('show');
            }, 5000);
          } else {
            alert('Algo deu errado. Tente novamente!');
          }
        }).catch(error => {
          alert('Algo deu errado. Tente novamente!');
        });
      });
    });

    // ========================================
    // INICIALIZAÇÃO
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      renderPortfolio();
      renderProfile(siteData.profile);
      renderSocial(siteData.social);
      
      if (window.location.hash === '#contact') {
        switchPage('contact');
      } else {
        switchPage('work');
      }
      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeProjectModal();
        if (e.key === 'ArrowLeft' && document.getElementById('projectModal').classList.contains('opacity-100')) {
          prevModalImage();
        }
        if (e.key === 'ArrowRight' && document.getElementById('projectModal').classList.contains('opacity-100')) {
          nextModalImage();
        }
      });
      
      window.addEventListener('popstate', () => {
        if (window.location.hash === '#contact') {
          switchPage('contact');
        } else {
          switchPage('work');
        }
      });
    });
  </script>
