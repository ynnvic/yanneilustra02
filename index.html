<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yanne Vicente - Portfolio</title>

  <style>
    body { font-family: 'Poppins', sans-serif; }
    .nav-link { 
      transition: color 0.3s ease; 
      color: rgb(131, 147, 195);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-link:hover { color: #fec643 !important; }
    .nav-link.active { color: #fec643 !important; }
    .page-hidden { display: none !important; }

    .portfolio-item { 
      position: relative; 
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1/1;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .portfolio-item:hover img { transform: scale(1.04); }
    .portfolio-item .overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
        display: flex; flex-direction: column; justify-content: flex-end;
        padding: 1rem; opacity: 0; transition: opacity 0.3s;
    }
    .portfolio-item:hover .overlay { opacity: 1; }
    
    .carousel-container { position: relative; overflow: hidden; }
    .carousel-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; }
    .carousel-slide.active { opacity: 1; }
    .carousel-dots { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 0.5rem; }
    .carousel-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: background 0.3s; }
    .carousel-dot.active { background: #fec643; }

    .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        flex: 1;
    }
    @media (max-width: 768px) {
        .split-layout { grid-template-columns: 1fr; }
    }
    .image-col { position: sticky; top: 0; height: calc(100 * min(var(--vh, 1vh), 1vh)); overflow: hidden; }
    .image-col img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 768px) {
        .image-col { position: relative; height: 50vh; }
    }
    
    .social-buttons { display: flex; gap: 20px; margin-top: 50px; }
    .icon-link {
        font-size: 35px; color: #ffbd59; text-decoration: none;
        transition: transform 0.3s ease, color 0.3s ease;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-link:hover { transform: translateY(-5px); }
    .instagram:hover { color: #E1306C; }
    .linkedin:hover { color: #0077B5; }
    .bluesky:hover { color: #0085ff; }
    .x-twitter:hover { color: #000000; }

    .portfolio-grid {
      gap: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    @media (max-width: 1024px) {
      .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .portfolio-grid { grid-template-columns: 1fr; }
    }

    /* Estilos do Modal - IMAGENS 2x maiores */
    .modal-image-wrapper {
      border-radius: 1rem;
      overflow: hidden;
      border: 5px solid white;
      width: 100%;
      height: 100%;
      min-height: 500px;
      max-height: 70vh;
    }
    .modal-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .modal-thumbnails {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
      scrollbar-width: thin;
      background: white;
      border-radius: 0 0 1rem 1rem;
    }
    .modal-thumbnails::-webkit-scrollbar {
      height: 4px;
    }
    .modal-thumbnails::-webkit-scrollbar-thumb {
      background: #fec643;
      border-radius: 4px;
    }
    .modal-thumbnails img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .modal-thumbnails img:hover {
      border-color: #fec643;
      transform: scale(1.05);
    }
    .modal-thumbnails img.active-thumb {
      border-color: #fec643;
      box-shadow: 0 0 0 2px #fec643;
    }

    /* Container do carrossel no modal */
    .modal-carousel-wrapper {
      background: white;
      border-radius: 1rem;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Footer com BG amarelo */
    .footer-yellow {
      background-color: #fec643 !important;
    }
    .footer-yellow p {
      color: #4a4a4a !important;
    }

    /* Ícones do menu */
    .menu-icon-link {
      color: rgb(131, 147, 195);
      transition: color 0.3s ease, transform 0.3s ease;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
    }
    .menu-icon-link:hover {
      color: #fec643;
      transform: scale(1.1);
    }

    /* Separador do menu - removido */
    .menu-separator {
      display: none;
    }

    /* Mensagem de sucesso do formulário */
    .form-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }
    .form-success.show {
      display: block;
    }

    /* Navegação do modal - visível apenas no hover */
    .modal-nav-btn {
      opacity: 0;
      transition: opacity 0.3s ease;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.8);
      border: none;
      border-radius: 50%;
      padding: 12px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }
    .modal-nav-btn:hover {
      background: white;
      transform: translateY(-50%) scale(1.1);
    }
    .modal-image-container:hover .modal-nav-btn {
      opacity: 1;
    }
    .modal-nav-btn.prev { left: 10px; }
    .modal-nav-btn.next { right: 10px; }

    /* Container da imagem no modal com posicionamento relativo */
    .modal-image-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border-radius: 1rem 1rem 0 0;
      min-height: 500px;
    }

    /* Logo */
    .logo-img {
      height: 40px;
      width: auto;
      cursor: pointer;
    }

    /* Ajuste do modal para melhor responsividade */
    .modal-content-wrapper {
      display: flex;
      flex-direction: row;
      max-height: 90vh;
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 1.5rem;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      .modal-content-wrapper {
        flex-direction: column;
        max-height: 95vh;
      }
      .modal-image-wrapper {
        min-height: 300px;
        max-height: 50vh;
      }
    }
  </style>
</head>

          description: [
            "These are some of the best commissions created for a group of RPG players.",
            "Ranging from D&D to Vampire: The Masquerade."
          ],
          gradeImage: "assets/images/projeto8.jpg",
          carouselImages: [
            "assets/images/projeto8_1.jpg",
            "assets/images/projeto8_2.jpg",
            "assets/images/projeto8_3.jpg"
          ]
        },
        {
          id: 9,
          title: "Steven Universe's Fanart",
          category: "Digital Cartoon Art",
          year: 2019,
          description: [
            "A personal project in which I created a fan art illustration based on the character Sardonyx from the animated series Steven Universe."
          ],
          gradeImage: "assets/images/projeto9.jpg",
          carouselImages: [
            "assets/images/projeto9_1.jpg",
            "assets/images/projeto9_2.jpg",
            "assets/images/projeto9_3.jpg"
          ]
        }
      ],
      profile: {
        name: "MEET YANNE",
        subtitle: "\\\\\\THE ARTIST BEHIND THE LAYOUT",
        bio: [
          "I'm a non-binary illustrator who believes the world looks way better when we draw on it.",
          "With a degree in Design from UFPE (Brazil), I've focused my craft on children's illustration and character design, mixing communication and art in a playful style.",
          "Whether I'm bringing whimsical flying guides to life or layouting books full of adventure, my focus is always on fun and representation. Let's have a talk and put your idea into a drawing?"
        ],
        photo: "assets/images/perfil.jpg",
        email: "yanne.vicentepaz@gmail.com"
      },
      social: {
        instagram: "https://instagram.com/yanne.vicente",
        linkedin: "https://linkedin.com/in/yannevicente",
        bluesky: "https://bsky.app/profile/yannevicente.bsky.social",
        twitter: "https://x.com/yannetheartist"
      }
    };

    let currentProjectIndex = 0;
    let currentImageIndex = 0;

    // ========================================
    // RENDERIZA O PORTFÓLIO (USA gradeImage)
    // ========================================
    function renderPortfolio() {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '';
      siteData.portfolio.forEach((project, index) => {
        const thumbImage = project.gradeImage || 'https://via.placeholder.com/800x800/cccccc/666666?text=Sem+imagem';
        grid.innerHTML += `
          <div class="portfolio-item" onclick="openProjectModal(${index})">
            <img loading="lazy" src="${thumbImage}" alt="${project.title}" onerror="this.src='https://via.placeholder.com/800x800/cccccc/666666?text=Imagem+não+encontrada'">
            <div class="overlay">
              <p class="font-bold text-sm" style="color: white;">${project.title}</p>
              <p class="text-xs opacity-80" style="color: rgba(255,255,255,0.8);">${project.category} · ${project.year}</p>
            </div>
          </div>
        `;
      });
    }

    // ========================================
    // RENDERIZA O PERFIL
    // ========================================
    function renderProfile(profile) {
      document.getElementById('profile-name').textContent = profile.name;
      document.getElementById('profile-subtitle').textContent = profile.subtitle;
      
      const profilePhoto = document.getElementById('profile-photo');
      profilePhoto.src = profile.photo + '?t=' + new Date().getTime();
      profilePhoto.onerror = function() {
        this.src = 'https://via.placeholder.com/800x800/cccccc/666666?text=Foto+de+Perfil';
      };
      
      const bioContainer = document.getElementById('profile-bio');
      bioContainer.innerHTML = '';
      profile.bio.forEach(text => {
        bioContainer.innerHTML += `<p class="leading-relaxed" style="color: rgb(74, 74, 74); font-size: 14px;">${text}</p>`;
      });
      document.getElementById('email-link').href = `mailto:${profile.email}`;
      document.getElementById('email-link').textContent = profile.email;
    }

    // ========================================
    // RENDERIZA REDES SOCIAIS
    // ========================================
    function renderSocial(social) {
      const container = document.getElementById('social-buttons');
      container.innerHTML = '';
      const icons = {
        instagram: 'fa-brands fa-instagram',
        linkedin: 'fa-brands fa-linkedin',
        bluesky: 'fa-brands fa-bluesky',
        twitter: 'fa-brands fa-x-twitter'
      };
      Object.keys(social).forEach(key => {
        if (social[key]) {
          container.innerHTML += `<a href="${social[key]}" target="_blank" rel="noopener" class="icon-link ${key}"><i class="${icons[key]}"></i></a>`;
        }
      });
    }

    // ========================================
    // FUNÇÕES DO MODAL
    // ========================================
    function openProjectModal(index) {
      currentProjectIndex = index;
      currentImageIndex = 0;
      updateModalContent();
      const modal = document.getElementById('projectModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100', 'pointer-events-auto');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      const modal = document.getElementById('projectModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100', 'pointer-events-auto');
      document.body.style.overflow = 'auto';
    }

    function prevModalImage() {
      const project = siteData.portfolio[currentProjectIndex];
      if (!project.carouselImages || project.carouselImages.length === 0) return;
      
      currentImageIndex = (currentImageIndex - 1 + project.carouselImages.length) % project.carouselImages.length;
      updateModalContent();
    }

    function nextModalImage() {
      const project = siteData.portfolio[currentProjectIndex];
      if (!project.carouselImages || project.carouselImages.length === 0) return;
      
      currentImageIndex = (currentImageIndex + 1) % project.carouselImages.length;
      updateModalContent();
    }

    function updateModalContent() {
      const project = siteData.portfolio[currentProjectIndex];
      const images = project.carouselImages || [];
      
      // Se não houver imagens no carrossel, usar a imagem da grade
      if (images.length === 0) {
        document.getElementById('modalImage').src = project.gradeImage;
      } else {
        const imageIndex = currentImageIndex % images.length;
        document.getElementById('modalImage').src = images[imageIndex];
      }
      
      document.getElementById('modalImage').onerror = function() {
        this.src = 'https://via.placeholder.com/800x800/cccccc/666666?text=Imagem+não+encontrada';
      };
      
      document.getElementById('modalTitle').textContent = project.title;
      document.getElementById('modalClient').textContent = `${project.category} · ${project.year}`;
      
      const descContainer = document.getElementById('modalDescription');
      descContainer.innerHTML = '';
      if (project.description && project.description.length > 0) {
        project.description.forEach(text => {
          descContainer.innerHTML += `<p>${text}</p>`;
        });
      } else {
        descContainer.innerHTML = `<p>${project.description || 'Sem descrição disponível.'}</p>`;
      }
      
      renderThumbnails(images);
    }

    function renderThumbnails(images) {
      const container = document.getElementById('modal-thumbnails');
      container.innerHTML = '';
      
      if (!images || images.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400 p-2">Sem imagens adicionais</p>';
        return;
      }
      
      images.forEach((img, index) => {
        const thumb = document.createElement('img');
        thumb.src = img;
        thumb.alt = `Thumbnail ${index + 1}`;
        thumb.className = index === currentImageIndex ? 'active-thumb' : '';
        thumb.onerror = function() {
          this.src = 'https://via.placeholder.com/60x60/cccccc/666666?text=?';
        };
        thumb.onclick = () => {
          currentImageIndex = index;
          updateModalContent();
        };
        container.appendChild(thumb);
      });
    }

    // ========================================
    // NAVEGAÇÃO
    // ========================================
    function switchPage(page) {
      const homeSection = document.getElementById('home-section');
      const contactSection = document.getElementById('contact-section');
      const navHome = document.getElementById('nav-home');
      const navContact = document.getElementById('nav-contact');
      
      navHome.classList.remove('active');
      navContact.classList.remove('active');
      
      if (page === 'contact') {
        homeSection.classList.add('page-hidden');
        contactSection.classList.remove('page-hidden');
        navContact.classList.add('active');
        history.pushState(null, '', '#contact');
      } else {
        homeSection.classList.remove('page-hidden');
        contactSection.classList.add('page-hidden');
        navHome.classList.add('active');
        history.pushState(null, '', '#home');
      }
      window.scrollTo(0, 0);
    }

    // ========================================
    // CARROSSEL DO BANNER
    // ========================================
    function setupCarousel() {
      const slides = document.querySelectorAll('.carousel-slide');
      const dotsContainer = document.getElementById('carousel-dots');
      let currentSlide = 0;

      slides.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
        dot.addEventListener('click', () => goToSlide(index));
        dotsContainer.appendChild(dot);
      });

      function goToSlide(index) {
        slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
        document.querySelectorAll('.carousel-dot').forEach((dot, i) => dot.classList.toggle('active', i === index));
        currentSlide = index;
      }

      setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        goToSlide(currentSlide);
      }, 6000);
    }

    // ========================================
    // FORMULÁRIO DE CONTATO
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('contact-form');
      const successMessage = document.getElementById('form-success-message');
      
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(form);
        
        fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        }).then(response => {
          if (response.ok) {
            successMessage.classList.add('show');
            form.reset();
            setTimeout(() => {
              successMessage.classList.remove('show');
            }, 5000);
          } else {
            alert('Algo deu errado. Tente novamente!');
          }
        }).catch(error => {
          alert('Algo deu errado. Tente novamente!');
        });
      });
    });

    // ========================================
    // INICIALIZAÇÃO
    // ========================================
    document.addEventListener('DOMContentLoaded', function() {
      renderPortfolio();
      renderProfile(siteData.profile);
      renderSocial(siteData.social);
      setupCarousel();
      
      if (window.location.hash === '#contact') {
        switchPage('contact');
      } else {
        switchPage('home');
      }
      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeProjectModal();
        if (e.key === 'ArrowLeft' && document.getElementById('projectModal').classList.contains('opacity-100')) {
          prevModalImage();
        }
        if (e.key === 'ArrowRight' && document.getElementById('projectModal').classList.contains('opacity-100')) {
          nextModalImage();
        }
      });
      
      window.addEventListener('popstate', () => {
        if (window.location.hash === '#contact') {
          switchPage('contact');
        } else {
          switchPage('home');
        }
      });
    });
  </script>
</body>
</html>
